<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="MLPerf 尾延迟分位与所需推断次数" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0.0" y="0.0" width="1180.0" height="430.0" rx="0" fill="#ffffff" stroke="none"/>
<text x="96.0" y="34.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1a1d21" text-anchor="start" font-weight="700">尾巴越靠后，测量成本涨得越快</text><text x="96.0" y="54.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5c6570" text-anchor="start" font-weight="400">MLPerf Inference 规则：达到 99% 置信区间所需的最少推断次数</text><rect x="191.1" y="300.7" width="137.8" height="19.3" rx="6" fill="#1f6feb" stroke="none"/><text x="260.0" y="274.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="700">24,576</text><text x="260.0" y="290.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5c6570" text-anchor="middle" font-weight="400">±0.50%</text><text x="260.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1a1d21" text-anchor="middle" font-weight="700">p90</text><rect x="519.1" y="274.9" width="137.8" height="45.1" rx="6" fill="#1f6feb" stroke="none"/><text x="588.0" y="248.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1f6feb" text-anchor="middle" font-weight="700">57,344</text><text x="588.0" y="264.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5c6570" text-anchor="middle" font-weight="400">±0.25%</text><text x="588.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1a1d21" text-anchor="middle" font-weight="700">p95</text><rect x="847.1" y="107.3" width="137.8" height="212.7" rx="6" fill="#d97706" stroke="none"/><text x="916.0" y="81.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">270,336</text><text x="916.0" y="97.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5c6570" text-anchor="middle" font-weight="400">±0.05%</text><text x="916.0" y="344.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#1a1d21" text-anchor="middle" font-weight="700">p99</text><line x1="96.0" y1="300.7" x2="1080.0" y2="300.7" stroke="#5c6570" stroke-width="1" stroke-dasharray="4 4"/><text x="102.0" y="292.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="10.5" fill="#5c6570" text-anchor="start" font-weight="400">以 p90 为基准</text><text x="588.0" y="366.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5c6570" text-anchor="middle" font-weight="400">≈ 2.3× p90 的样本量</text><text x="916.0" y="366.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5c6570" text-anchor="middle" font-weight="400">≈ 11.0× p90 的样本量</text><line x1="96.0" y1="320.0" x2="1080.0" y2="320.0" stroke="#e2e6ea" stroke-width="1.5"/></svg>
